# 合并 main 即发布：GitHub 免费托管 runner 构建镜像推 ACR，再经受限 SSH 密钥
# 部署到香港测试机（密钥在服务器侧强制命令锁定为 /opt/apps/app41/deploy.sh，
# 只能触发 pull→up→冒烟，执行不了别的；主机指纹以 DEPLOY_KNOWN_HOSTS 钉死防 MITM）。
# pull 重试（抗跨境瞬断）与冒烟轮询逻辑在服务器脚本里，输出随 SSH 流回本 workflow。
# 服务器脚本版本化副本：docker/deploy-remote.sh——改动两处同步。
name: deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

# 部署不可并发：排队不取消，避免两轮 pull/up 互相踩
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 登录 ACR(重试抗瞬断)
        run: |
          for i in 1 2 3 4 5; do
            echo "${{ secrets.ACR_PASSWORD }}" | docker login "${{ secrets.ACR_REGISTRY }}" -u "${{ secrets.ACR_USERNAME }}" --password-stdin && break
            echo "login 失败,第 $i 次重试"; sleep 5
          done

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ secrets.ACR_REGISTRY }}/xiaowenz/app41:${{ github.sha }}
            ${{ secrets.ACR_REGISTRY }}/xiaowenz/app41:main
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 阿里云 ACR 个人版不认 buildx 默认的 provenance 认证清单（vnd.oci.empty）——关掉
          provenance: false

      - name: 部署到测试机并冒烟（受限密钥 → 服务器 deploy.sh）
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          # 密钥在服务器侧被强制命令接管：不带远程命令，连上即执行部署脚本；退出码即部署成败
          ssh -F /dev/null -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST"
